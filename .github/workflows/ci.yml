name: CI

on:
  push:
    branches: [main]
    tags-ignore: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The runner's rustup is 2.x and rejects the `stable-x86_64-pc-windows-gnu`
  # channel name in rust-toolchain.toml, so pin the toolchain by env var and
  # cross-compile to the same target the repo builds for locally.
  RUSTUP_TOOLCHAIN: stable
  CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: C:\msys64\mingw64\bin\gcc.exe

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mingw-w64 (the gnu target needs a C linker)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc
          path-type: inherit

      - name: Prepare toolchain
        run: |
          rustup --version
          rustup target add x86_64-pc-windows-gnu
          rustup component add clippy
          gcc --version | head -1
          ld --version | head -1

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build
        run: cargo build --release --locked --target x86_64-pc-windows-gnu

      - name: Clippy
        run: cargo clippy --release --all-targets --locked --target x86_64-pc-windows-gnu

      # A broken import table (seen with GNU ld 2.47) crashes before argument
      # parsing, so running --help is a real link sanity check.
      - name: Smoke test
        run: |
          .\target\x86_64-pc-windows-gnu\release\rec-r.exe --help
          .\target\x86_64-pc-windows-gnu\release\rec-r.exe autostart status --json

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: rec-r-${{ github.sha }}
          path: target/x86_64-pc-windows-gnu/release/rec-r.exe
          if-no-files-found: error