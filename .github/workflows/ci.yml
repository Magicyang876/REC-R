name: CI

on:
  push:
    branches: [main]
    tags-ignore: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The repo pins the gnu toolchain (rust-toolchain.toml); point rustc at msys2's gcc.
  CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: C:\msys64\mingw64\bin\gcc.exe

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mingw-w64 (the gnu target needs a C linker)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc
          path-type: inherit

      - name: Show toolchain versions
        run: |
          rustc --version
          cargo --version
          gcc --version | head -1
          ld --version | head -1

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build
        run: cargo build --release --locked

      - name: Clippy
        run: cargo clippy --release --all-targets --locked

      # A broken import table (seen with GNU ld 2.47) crashes before argument
      # parsing, so running --help is a real link sanity check.
      - name: Smoke test
        run: |
          .\target\release\rec-r.exe --help
          .\target\release\rec-r.exe autostart status --json

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: rec-r-${{ github.sha }}
          path: target/release/rec-r.exe
          if-no-files-found: error