name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)release, e.g. v0.1.0"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # rustup 2.x on the runner rejects the `stable-x86_64-pc-windows-gnu` channel
  # name in rust-toolchain.toml, so pin by env var and cross-compile instead.
  RUSTUP_TOOLCHAIN: stable

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install mingw-w64 (the gnu target needs a C linker)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          suppress-deprecation-warnings: msystem-mingw64
          update: false
          install: mingw-w64-x86_64-gcc
          path-type: inherit

      - name: Prepare toolchain
        run: |
          rustup target add x86_64-pc-windows-gnu
          gcc --version | head -1
          ld --version | head -1

      # setup-msys2 unpacks its own MSYS2 somewhere under D:\a\_temp, not
      # C:\msys64, so the linker path has to come from the resolved gcc.
      - name: Point cargo at the mingw gcc
        shell: pwsh
        run: |
          $gcc = (Get-Command gcc).Source
          Write-Host "linker: $gcc"
          "CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER=$gcc" >> $env:GITHUB_ENV

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build
        run: cargo build --release --locked --target x86_64-pc-windows-gnu

      # A broken import table (GNU ld 2.47 has produced one) crashes before
      # argument parsing, so this must fail the release rather than ship a
      # binary that segfaults on start.
      - name: Smoke test
        run: |
          .\target\x86_64-pc-windows-gnu\release\rec-r.exe --help
          .\target\x86_64-pc-windows-gnu\release\rec-r.exe autostart status --json

      - name: Package
        id: package
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="${tag#v}"
          name="rec-r-${version}-x86_64-pc-windows-gnu"
          mkdir -p dist
          cp target/x86_64-pc-windows-gnu/release/rec-r.exe "dist/${name}.exe"
          (cd dist && sha256sum "${name}.exe" > "${name}.exe.sha256")
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          ls -l dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: rec-r ${{ steps.package.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            dist/${{ steps.package.outputs.name }}.exe
            dist/${{ steps.package.outputs.name }}.exe.sha256