name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)release, e.g. v0.1.0"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: C:\msys64\mingw64\bin\gcc.exe

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install mingw-w64 (the gnu target needs a C linker)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc
          path-type: inherit

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build
        run: cargo build --release --locked

      # A broken import table (GNU ld 2.47 has produced one) crashes before
      # argument parsing, so this must fail the release rather than ship a
      # binary that segfaults on start.
      - name: Smoke test
        run: |
          .\target\release\rec-r.exe --help
          .\target\release\rec-r.exe autostart status --json

      - name: Package
        id: package
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="${tag#v}"
          name="rec-r-${version}-x86_64-pc-windows-gnu"
          mkdir -p dist
          cp target/release/rec-r.exe "dist/${name}.exe"
          (cd dist && sha256sum "${name}.exe" > "${name}.exe.sha256")
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          ls -l dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: rec-r ${{ steps.package.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/${{ steps.package.outputs.name }}.exe
            dist/${{ steps.package.outputs.name }}.exe.sha256