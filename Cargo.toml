[package]
name = "rec-r"
version = "0.1.3"
edition = "2021"
rust-version = "1.88"
description = "Screen capture & recording for Windows with an MCP server for agents"
authors = ["rec-r"]

[dependencies]
# --- MCP ---
rmcp = { version = "3.10", features = [
    "server",
    "macros",
    "transport-io",
    "transport-streamable-http-server",
] }
axum = "0.8"
tokio-util = { version = "0.7", features = ["rt"] }
base64 = "0.22"

# --- runtime ---
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
chrono = "0.4"
dirs = "6"

# --- Windows ---
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_LibraryLoader",
    "Win32_System_Console",
    "Win32_System_SystemInformation",
    "Win32_System_Registry",
    "Win32_System_Com",
    "Win32_System_Memory",
    "Win32_System_DataExchange",
    "Win32_Storage_Xps",
    "Win32_Graphics_Gdi",
] }
windows-capture = { version = "2.0", default-features = false }

[profile.release]
opt-level = 2
lto = "thin"
strip = true